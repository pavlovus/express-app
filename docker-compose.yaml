services:
  app:
    image: pavlovus/express-app:latest
    ports:
      - "8080:8080"
    container_name: express-app
    restart: always

  watchtower:
    image: nickfedor/watchtower
    environment:
      - WATCHTOWER_POLL_INTERVAL=60
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    container_name: watchtower
    restart: always
